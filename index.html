<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ชื่อแท็บของหน้าแนะนำตัว -->
    <title>หน้าแนะนำตัวของฉัน</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Tahoma",
                "Arial",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #d5ebd0,
                    #f4faef
                );

            color: #355c3a;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;
        }


        /* =========================
           กล่องหลัก
        ========================= */

        .card {

            width: 100%;

            max-width: 1100px;

            min-height: 90vh;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

            border-radius: 35px;

            padding:
                50px 30px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(
                    73,
                    120,
                    70,
                    0.15
                );

            border:
                4px solid transparent;

            background:
                linear-gradient(
                    white,
                    white
                ) padding-box,

                linear-gradient(
                    135deg,
                    #a8d5a2,
                    #4f8f52,
                    #c5e6b8,
                    #6ba96b
                ) border-box;
        }


        /* =========================
           หัวข้อ
        ========================= */

        h1 {

            color: #356b3d;

            font-size:
                clamp(
                    28px,
                    4vw,
                    42px
                );

            margin:
                0 0 15px;

            font-weight: bold;
        }


        .subtitle {

            color: #78a878;

            font-size: 18px;

            margin-bottom: 30px;
        }


        /* =========================
           รูปโปรไฟล์
        ========================= */

        .profile-frame {

            width: 230px;

            height: 230px;

            margin:
                0 auto 30px;

            padding: 8px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #b7ddb0,
                    #5d9b60,
                    #d8efd0,
                    #78b878
                );

            box-shadow:
                0 8px 25px
                rgba(
                    73,
                    120,
                    70,
                    0.2
                );
        }


        .profile-frame img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            display: block;

            border:
                5px solid white;
        }


        /* =========================
           กล่องข้อมูล
        ========================= */

        .info-box {

            max-width: 850px;

            margin: 0 auto;

            padding: 25px;

            background: #f3faef;

            border-radius: 25px;

            border:
                1px solid #d5e9cf;
        }


        p {

            font-size: 18px;

            line-height: 1.8;

            margin:
                12px 0;

            color: #4c704f;
        }


        strong {

            color: #356b3d;
        }


        /* =========================
           ปุ่มไป Portfolio
        ========================= */

        .portfolio-btn {

            display: inline-block;

            margin-top: 30px;

            padding:
                15px 35px;

            background:
                linear-gradient(
                    135deg,
                    #6fa96b,
                    #3f7d47
                );

            color: white;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;

            border-radius: 50px;

            box-shadow:
                0 6px 15px
                rgba(
                    63,
                    125,
                    71,
                    0.25
                );

            transition: 0.3s;
        }


        .portfolio-btn:hover {

            transform:
                translateY(-3px);

            background:
                linear-gradient(
                    135deg,
                    #5d9659,
                    #356b3d
                );

            box-shadow:
                0 10px 20px
                rgba(
                    63,
                    125,
                    71,
                    0.3
                );
        }


        /* =========================
           Footer
        ========================= */

        .footer {

            margin-top: 35px;

            color: #91b68c;

            font-size: 14px;
        }


        /* =========================
           มือถือ
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            .card {

                min-height: 95vh;

                padding:
                    35px 20px;

                border-radius: 25px;
            }


            .profile-frame {

                width: 190px;

                height: 190px;
            }


            h1 {

                font-size: 28px;
            }


            p {

                font-size: 16px;
            }


            .portfolio-btn {

                font-size: 16px;

                padding:
                    13px 25px;
            }

        }

    </style>

</head>


<body>


    <div class="card">


        <h1>
            ยินดีต้อนรับสู่โปรไฟล์ของฉัน
        </h1>


        <div class="subtitle">

            Welcome to my personal website

        </div>


        <!-- รูปโปรไฟล์ -->

        <div class="profile-frame">

            <img
                src="5A8A4474-1299-42CB-8CC7-217448973047.jpeg"
                alt="รูปโปรไฟล์ของพีรพัฒน์ งามแสง"
            >

        </div>


        <!-- ข้อมูล -->

        <div class="info-box">


            <p>

                สวัสดีครับ! ผมชื่อ
                <strong>
                    พีรพัฒน์ งามแสง
                </strong>

            </p>


            <p>

                <strong>
                    (Peerapat Ngamsaeng)
                </strong>

            </p>


            <p>

                ขณะนี้กำลังศึกษา/สนใจด้าน
                <strong>
                    Civil Engineering
                </strong>

            </p>


            <p>

                กำลังศึกษาชั้นมัธยมศึกษาปีที่ 6
                แผนการเรียน เตรียมวิศวกรรมศาสตร์
                ⚙️🛠️

            </p>


        </div>


        <!--
            กดปุ่มนี้แล้วไปหน้า Portfolio
            โดยตรง
        -->

        <a
            href="portfolio.html"
            class="portfolio-btn"
        >

            👉 ดูแฟ้มสะสมงานของผม 👈

        </a>


        <div class="footer">

            Portfolio | พีรพัฒน์ งามแสง

        </div>


    </div>


</body>

</html>
